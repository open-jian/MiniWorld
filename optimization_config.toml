# Central inference optimization switches, read once when a model is created.
# Create a new model after editing this file for changes to take effect.
# Include only optimizations implemented in this branch. Sink, window size,
# sampling steps, and precision are configured separately.
# Extend miniworld/optimization_config.py when adding a switch; unknown keys fail.
schema_version = 1

# true: request Chunkwise FlashAttention; false: use the original masked SDPA.
# When true, existing fallbacks for CPU, FP32, and unsupported GPUs/head_dim apply.
# Affects only chunk-causal attention in forward_with_cache, not training attention.
chunkwise_flash_attention = true

# Project frame-uniform timestep/action conditioning once per latent frame,
# then broadcast modulation across spatial tokens within the same forward.
# Applies only to eval forward_with_cache with global/per-frame timesteps;
# per-token timesteps and training retain the original projection layout.
# Spatial pose conditioning remains per-token. No cross-step or CFG cache is used.
# Smaller GEMMs can change BF16 rounding; precision settings are not changed.
# Enabled by default; set false to use the original tokenwise projection path.
framewise_conditioning = true

# Fuse hidden-state RMSNorm and AdaLN in eligible cached CUDA inference calls.
# Read the actual channel-major strides without copying the residual tensor.
# Preserve FP32 statistics/weights, epsilon, and intermediate BF16 rounding.
# Training, gradient-enabled calls, and unsupported inputs use the reference path.
# Reduction order may still differ; false selects the original separate operations.
fused_norm_modulation = true

# Build the current RoPE coefficients once per cached inference forward and share
# them across Q/K and all transformer blocks. Preserve the original construction
# device, dtype, positions, and the checkpoint-table special case. No persistent
# cache or invalidation state is introduced; training/grad-enabled calls fall back.
reuse_rope_frequencies = true
