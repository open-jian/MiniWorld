# Central inference optimization switches, read once when a model is created.
# Create a new model after editing this file for changes to take effect.
# Include only optimizations implemented in this branch. Sink, window size,
# sampling steps, and precision are configured separately.
# Extend miniworld/optimization_config.py when adding a switch; unknown keys fail.
schema_version = 1

# true: request Chunkwise FlashAttention; false: use the original masked SDPA.
# When true, existing fallbacks for CPU, FP32, and unsupported GPUs/head_dim apply.
# Affects only chunk-causal attention in forward_with_cache, not training attention.
chunkwise_flash_attention = true

# Project frame-uniform timestep/action conditioning once per latent frame,
# then broadcast modulation across spatial tokens within the same forward.
# Applies only to eval forward_with_cache with global/per-frame timesteps;
# per-token timesteps and training retain the original projection layout.
# Spatial pose conditioning remains per-token. No cross-step or CFG cache is used.
# Smaller GEMMs can change BF16 rounding; precision settings are not changed.
# Enabled by default; set false to use the original tokenwise projection path.
framewise_conditioning = true

# Fuse hidden-state RMSNorm and AdaLN in eligible cached CUDA inference calls.
# Read the actual channel-major strides without copying the residual tensor.
# Preserve FP32 statistics/weights, epsilon, and intermediate BF16 rounding.
# Training, gradient-enabled calls, and unsupported inputs use the reference path.
# Reduction order may still differ; false selects the original separate operations.
fused_norm_modulation = true

# Build the current RoPE coefficients once per cached inference forward and share
# them across Q/K and all transformer blocks. Preserve the original construction
# device, dtype, positions, and the checkpoint-table special case. No persistent
# cache or invalidation state is introduced; training/grad-enabled calls fall back.
reuse_rope_frequencies = true

# Fuse gate * update and residual addition in eligible cached CUDA BF16 eval.
# Keep the product's BF16 rounding before addition, and preserve the residual
# layout. No intermediate gated-update tensor or persistent cache is allocated.
# Unsupported inputs, training, and gradient-enabled calls use the original path.
# Set false for an independent comparison with all other switches unchanged.
fused_residual_gate_add = true

# Fuse current Q/K rotation into one kernel per tensor in eligible cached eval.
# Consume the original cos/sin coefficients and preserve FP32 product/add rounding
# and output layout. Frequency reuse has its own independent switch above.
# This does not fuse QK normalization, K concatenation/casting, or cache rebasing.
# Training, enabled gradients, hooks/custom RoPE, and unsupported tensors fall back.
# Set false to compare against the original rotation with all other switches fixed.
fused_rope = true

# Fuse W12's separate bias add, SiLU, and gated product in cached CUDA BF16 eval.
# Keep the original matrix multiply and every BF16 bias/add/activation boundary;
# intermediate bias-added and SiLU tensors are no longer written to memory.
# Only the validated single-batch channel-major FP32 Linear input is eligible.
# Training, gradients, hooks/custom modules, and other layouts/dtypes stay eager.
# No weights, checkpoint keys, sampler settings, or persistent caches are changed.
# Set false to compare against the accepted baseline with the other switches on.
fused_bias_swiglu = true

# Fuse temporary FP32 K concatenation and its BF16 attention-input conversion.
# Read history/current K once and write the final contiguous BHND BF16 tensor;
# canonical K returned to the cache stays FP32 for commits and RoPE rebasing.
# This still reads all visible history per call; it creates no persistent copy.
# Only validated B=1, heads=12, head_dim=128 cached Chunkwise FlashAttention
# with CUDA BF16 autocast and gradients disabled is eligible. Empty history,
# training, custom forwards/hooks, and unsupported inputs keep the original path.
# V, cache capacity, sink, sampling and other optimization switches are unchanged.
# Set false for the accepted seven-optimization baseline.
fused_k_concat_cast = true
